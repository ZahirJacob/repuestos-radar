name: Daily ingestion

on:
  schedule:
    # 09:00 UTC = 06:00 in Argentina (UTC-3). Courtesy policy: exactly one
    # scheduled run per day — never add a second cron entry.
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Runs must never overlap (one polite run at a time); a manual run during the
# scheduled one queues instead of racing it.
concurrency:
  group: daily-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    # Worst case is delay-dominated: up to 320 Tiendanube category pages
    # (160 mdrepuestos + 80 gofix + 80 onestore) at the 1s courtesy delay
    # plus real fetch latency ≈ 10-11 min, plus the search-based sources.
    timeout-minutes: 20
    steps:
      # Third-party actions are pinned to full commit SHAs: this job holds the
      # production DATABASE_URL secret, and a moving tag could be repointed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Run ingestion
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python -m repuestos_radar.ingest
