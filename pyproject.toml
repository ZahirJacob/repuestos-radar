[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repuestos-radar"
version = "0.1.0"
description = "Market intelligence for phone repair shops: multi-source price tracking for phone spare parts and used phones."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Zahir Jacob" }]
dependencies = [
    "httpx",
    "sqlalchemy",
    "pandas",
    "pyyaml",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/repuestos_radar"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
